{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<h1>Users</h1>
<div class="toolbar"><span class="spacer"></span><a class="button primary" href="/user/new">New user</a></div>
<div class="table-wrap">
<table>
  <thead><tr><th>User name</th><th>Email</th><th>Role</th><th></th></tr></thead>
  <tbody>
  {% for u in users %}
    <tr>
      <td><a href="/user/{{ u.id }}">{{ u.username }}</a> {% if !u.is_active %}<span class="badge">inactive</span>{% endif %}</td>
      <td>{{ u.email }}</td>
      <td>{{ u.role }}</td>
      <td class="actions">
        <form method="post" action="/user/{{ u.id }}/delete" onsubmit="return confirm('Delete this user?')"><button class="small danger">Delete</button></form>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
