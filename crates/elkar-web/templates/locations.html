{% extends "base.html" %}
{% block title %}Backup locations{% endblock %}
{% block content %}
<h1>Backup locations</h1>
<div class="toolbar"><span class="spacer"></span><a class="button primary" href="/location/new">New location</a></div>
<div class="table-wrap">
<table>
  <thead><tr><th>Name</th><th>Directory</th><th>Max parallel jobs</th><th></th></tr></thead>
  <tbody>
  {% for l in locations %}
    <tr>
      <td><a href="/location/{{ l.id }}">{{ l.name }}</a></td>
      <td><code>{{ l.directory }}</code></td>
      <td>{{ l.max_parallel_jobs }}</td>
      <td class="actions">
        <form method="post" action="/location/{{ l.id }}/delete" onsubmit="return confirm('Delete this location?')"><button class="small danger">Delete</button></form>
      </td>
    </tr>
  {% else %}
    <tr><td colspan="4" class="muted">No backup locations.</td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
